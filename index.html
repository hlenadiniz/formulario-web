<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIDS Rotulação Humana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única estreita, no mesmo ritmo do prompt (seções # PAPEL, # ENTRADAS, # RESPOSTA). Mensagem em mono, como dado dentro de <mensagem>. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#161a22; --muted:#5d6676; --line:#dde1e8;
  --accent:#2b4fd6; --accent-fg:#ffffff; --accent-soft:#e6ebfb;
  --yes:#157a4a; --yes-soft:#dff3e8; --no:#b4412f; --no-soft:#f8e4e0;
  --code-bg:#eef0f4; --tag:#8a93a5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1e26; --fg:#e8ebf1; --muted:#9aa3b4; --line:#2c323e;
  --accent:#7d98ff; --accent-fg:#0d1330; --accent-soft:#232c4f;
  --yes:#5fd39a; --yes-soft:#17382a; --no:#f0897a; --no-soft:#432520;
  --code-bg:#12151b; --tag:#6f7a8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1e26; --fg:#e8ebf1; --muted:#9aa3b4; --line:#2c323e;
  --accent:#7d98ff; --accent-fg:#0d1330; --accent-soft:#232c4f;
  --yes:#5fd39a; --yes-soft:#17382a; --no:#f0897a; --no-soft:#432520;
  --code-bg:#12151b; --tag:#6f7a8f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.01em}
.brand small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:8px}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.linkbtn{background:none;border:0;color:var(--muted);padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
details.card>summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.card>summary::after{content:"+";font-size:16px;line-height:1}
details.card[open]>summary::after{content:"–"}
details.card .body{margin-top:12px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
details.card h4{font-family:var(--mono);font-size:12px;margin:8px 0 0;letter-spacing:.06em;color:var(--fg)}
details.card p,details.card ul{margin:0}
details.card ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tagline{font-family:var(--mono);font-size:12px;color:var(--tag)}
.msg{font-family:var(--mono);font-size:18px;line-height:1.5;background:var(--code-bg);border-radius:4px;padding:14px;margin:6px 0 0;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--fg)}
.rot{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.rot h3{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.rot .f{display:flex;flex-direction:column;gap:2px;max-width:68ch}
.rot .f .tagline{margin-bottom:2px}
.rot .f div:last-child{overflow-wrap:anywhere}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{min-height:64px;border-radius:6px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ans button small{font:400 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.ans .yes:hover,.ans .yes.on{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
.ans .no:hover,.ans .no.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status.err{color:var(--no)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px 8px;display:flex;flex-direction:column;gap:2px;align-items:center}
.slots button b{font-size:22px}
.slots button small{font:400 11px var(--mono);color:var(--muted)}
.slots button:hover{border-color:var(--accent);background:var(--accent-soft)}
h1{font-size:22px;margin:0;line-height:1.25}
.lead{color:var(--muted);margin:0;max-width:60ch}
.empty{text-align:left;padding:24px 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.scroll{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:500}
.field small{color:var(--muted)}
input[type=file],input[type=number]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}
.warn{color:var(--no);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font:500 12px var(--mono);padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}

.lab{display:flex;flex-direction:column;gap:10px}
.lab .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lab h3{margin:0;font-size:18px;line-height:1.25;text-wrap:balance}
.lab .d{max-width:68ch;overflow-wrap:anywhere}
.lab details summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lab details div{margin-top:6px;max-width:68ch;overflow-wrap:anywhere}
.lab .ans button{min-height:48px;font-size:17px}
.lab.done{border-left:4px solid var(--accent)}
body{margin:0}
/* ---- validação: entrada, rótulo com definição acessível ---- */
.intro{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.intro h1{font-size:24px}
.intro h2{font-size:15px;margin:6px 0 0;font-weight:600}
.intro p,.intro ul{margin:0}
.intro ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.intro a{color:var(--accent)}
.q{font-size:18px;font-weight:600;margin:0 0 10px;text-wrap:balance}
.rotulo{display:flex;flex-direction:column;gap:10px}
.term{font-size:22px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
details.def summary{cursor:pointer;color:var(--accent);font-size:14px}
details.def .defbody{margin-top:8px;display:flex;flex-direction:column;gap:8px;max-width:68ch;overflow-wrap:anywhere}
details.def .defbody b{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.slots button.last{border-color:var(--accent);background:var(--accent-soft)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lk{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:84px;font-size:13px;line-height:1.25}
.lk b{font-size:20px}
.lk1:hover,.lk1.on,.lk2:hover,.lk2.on{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.lk3:hover,.lk3.on{border-color:var(--muted);background:var(--code-bg)}
.lk4:hover,.lk4.on,.lk5:hover,.lk5.on{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
@media (max-width:560px){.likert{grid-template-columns:1fr}.lk{flex-direction:row;justify-content:flex-start;text-align:left;min-height:52px;padding:10px 14px}.lk b{min-width:24px}}
.login{display:flex;flex-direction:column;gap:14px;max-width:460px}
.login input{font:500 20px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.login .err{color:var(--no);font-size:14px;min-height:20px}
</style></head>
<body><div class="wrap" id="app"><div class="card empty"><p class="lead">Carregando…</p></div></div>
<script src="config.js"></script>
<script>
const CFG = window.KIDS_CONFIG;
const $app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==="class") el.className=v; else if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if (v!==false && v!=null) el.setAttribute(k,v===true?"":v);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) el.append(c.nodeType?c:document.createTextNode(c));
  return el;
}
function norm(s){return String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\(\s*\d+\s*ANOS?\s*\)/g,"").replace(/[^A-Z0-9]+/g," ").trim();}

const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const first = text.split(/\r?\n/,1)[0]||"";
  const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ";" : ",";
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===delim){row.push(cur);cur="";}
    else if (c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cur);cur=""; if(row.some(x=>x!==""))rows.push(row); row=[]; }
    else cur+=c;
  }
  if (cur!==""||row.length){row.push(cur); if(row.some(x=>x!==""))rows.push(row);}
  if(!rows.length) return [];
  const head = rows[0].map(x=>x.trim());
  return rows.slice(1).map(r=>Object.fromEntries(head.map((k,i)=>[k,(r[i]??"").trim()])));
}
function pick(row, names){
  const keys = Object.keys(row);
  for (const n of names){ const k = keys.find(k=>norm(k)===norm(n)); if (k) return k; }
  return null;
}


/* ---------- Supabase (REST direto) ---------- */
const RPC = CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/";
const HDR = { apikey:CFG.SUPABASE_ANON_KEY, "Content-Type":"application/json" };
// Chave nova (sb_publishable_...) vai só em "apikey"; a antiga (JWT, eyJ...) também em Authorization.
if (/^eyJ/.test(CFG.SUPABASE_ANON_KEY)) HDR.Authorization = "Bearer " + CFG.SUPABASE_ANON_KEY;
async function rpc(fn, body){
  const r = await fetch(RPC+fn, {method:"POST", headers:HDR, body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

/* ---------- estado ---------- */
const S = { labels:{}, ann:null, code:null, resp:new Map(), idx:0, mine:[], pending:[], flushing:false, saveErr:null };

async function init(){
  try{
    const lt = await fetch(CFG.ARQUIVO_ROTULOS);
    if(!lt.ok) throw new Error("arquivo de rótulos não encontrado");
    const lrows = parseCSV(await lt.text());
    const r0=lrows[0]||{}, nk=pick(r0,["Label","rotulo","nome"]), dk=pick(r0,["Description","descricao","descrição"]), ek=pick(r0,["Examples","exemplos"]);
    for(const r of lrows){ const name=r[nk]; if(!name) continue; const k=norm(name); if(S.labels[k]) continue;
      S.labels[k]={name,desc:(r[dk]||"").replace(/\s*\n\s*/g," "),ex:(r[ek]||"").replace(/\s*\n\s*/g," ")}; }
  }catch(e){ return renderMsg("Não consegui carregar os dados do formulário: "+e.message); }
  try{ S.pending = JSON.parse(ls.get("kids_pending")||"[]").filter(p=>p.c); }catch(e){ S.pending=[]; }
  if(ls.get("kids_intro")!=="1") return renderIntro(proceed);
  proceed();
}
function proceed(){
  const c=ls.get("kids_code");
  if(c) login(c,true); else renderLogin();
}
function normCode(c){ return String(c||"").trim().toUpperCase().replace(/[\s-]+/g,""); }
async function login(code,auto){
  const c=normCode(code); renderMsg("Entrando…");
  let d;
  try{ d = await rpc("entrar",{p_codigo:c}); }
  catch(e){ return renderLogin("Não consegui conectar ao servidor. Confira a internet e tente de novo."); }
  if(!d){ if(auto) ls.set("kids_code",""); return renderLogin(auto?"":"Código não reconhecido. Confira e tente de novo."); }
  ls.set("kids_code",c); startAnnotating(d,c);
}

function renderMsg(t){ $app.replaceChildren(h("div",{class:"card empty"},h("p",{class:"lead"},t))); }
/* ---------- tela de entrada (uma vez) ---------- */
function renderIntro(next){
  S.view="intro";
  const first = ls.get("kids_intro")!=="1";
  const body = h("div",{class:"card intro"},
    h("h1",{},"Antes de começar"),
    h("p",{},"As mensagens que você vai ler foram coletadas do chat ao vivo da Twitch (",
      h("a",{href:"https://www.twitch.tv",target:"_blank",rel:"noopener"},"twitch.tv"),
      "). O chat é público e acontece em tempo real, enquanto as pessoas assistem às transmissões."),
    h("h2",{},"Considere o contexto"),
    h("p",{},"Leia cada mensagem como ela seria lida no chat: são textos curtos e informais, em português, com gírias, abreviações, memes, ironia, erros de grafia e expressões próprias da plataforma. Interprete o sentido pretendido, não só as palavras soltas."),
    h("h2",{},"Os rótulos"),
    h("p",{},"Cada mensagem aparece com um rótulo, tirado do ClassInd, o guia brasileiro de classificação indicativa. Cada rótulo tem um nome, uma descrição que define a situação e um exemplo. Em cada tela, se tiver dúvida, abra “Ver descrição e exemplo” para ler a definição do rótulo."),
    h("h2",{},"O que você vai fazer"),
    h("p",{},"Para cada mensagem, indique o quanto você concorda que o rótulo apresentado descreve corretamente a mensagem, de 1 (discordo totalmente) a 5 (concordo totalmente). Para decidir:"),
    h("ul",{},
      h("li",{},"Mencionar o tema do rótulo não basta. A mensagem deve expressar, de forma explícita ou implícita, a situação descrita no rótulo."),
      h("li",{},"Os exemplos ilustram a definição e não esgotam as situações possíveis.")),
    h("p",{class:"hint"},"Suas respostas são salvas na hora. Você pode voltar e mudar qualquer resposta."),
    h("div",{class:"row"},h("button",{class:"btn primary",id:"intro-ok",onclick:()=>{ls.set("kids_intro","1");next();}},first?"Entendi, começar":"Voltar às mensagens")));
  $app.replaceChildren(h("div",{class:"topbar"},h("div",{class:"bar-row"},h("div",{class:"brand"},"KIDS",h("small",{},"validação de rótulos")))),body);
  window.scrollTo(0,0);
}

function renderLogin(msg){
  S.view="login"; S.ann=null;
  const inp=h("input",{id:"code",type:"text",autocomplete:"off",autocapitalize:"characters",spellcheck:"false",placeholder:"XXXX-XXXX","aria-label":"Código pessoal"});
  const err=h("div",{class:"err",id:"code-err"},msg||"");
  const form=h("form",{class:"card login",onsubmit:e=>{e.preventDefault(); const v=inp.value; if(!normCode(v)){err.textContent="Digite o seu código.";return;} err.textContent=""; login(v,false);}},
    h("h1",{},"Entrar"),
    h("p",{class:"lead"},"Digite o código pessoal que você recebeu. Ele guarda o seu progresso: com o mesmo código, em qualquer aparelho, você continua de onde parou."),
    inp, err, h("div",{class:"row"},h("button",{class:"btn primary",type:"submit"},"Entrar")));
  $app.replaceChildren(
    h("div",{class:"topbar"},h("div",{class:"bar-row"},h("div",{class:"brand"},"KIDS",h("small",{},"validação de rótulos")),
      h("button",{class:"linkbtn",onclick:()=>renderIntro(()=>renderLogin())},"Ver instruções"))),
    form);
  inp.focus();
}

function startAnnotating(d,code){
  S.ann=d.slot; S.code=code; S.saveErr=null;
  S.mine = d.itens.map(x=>({i:x.item,m:x.mensagem,l:x.rotulo,p:x.persona}));
  S.resp = new Map(d.respostas.map(r=>[r.item,r.resposta]));
  for(const p of S.pending) if(p.c===code) S.resp.set(p.item,p.resposta);
  const first = S.mine.findIndex(x=>!S.resp.has(x.i));
  S.idx = first<0 ? 0 : first; flush(); renderItem();
}

function labelFor(it){
  const L = S.labels[norm(it.l)];
  return { name:L?L.name:it.l, desc:L?L.desc:"(descrição não disponível)", ex:L?L.ex:"" };
}

function renderItem(){
  S.view="item";
  const n=S.mine.length, done=S.mine.filter(x=>S.resp.has(x.i)).length, finished=done===n&&n>0;
  const topbar = h("div",{class:"topbar"},
    h("div",{class:"bar-row"},h("div",{class:"brand"},"KIDS",h("small",{},`anotador ${S.ann} · ${done}/${n} respondidos`)),
      h("div",{class:"row"},
        h("button",{class:"linkbtn",onclick:()=>renderIntro(renderItem)},"Ver instruções"),
        h("button",{class:"linkbtn",onclick:()=>{ls.set("kids_code","");renderLogin();}},"Sair"))),
    h("div",{class:"progress"},h("i",{style:`width:${n?100*done/n:0}%`})));
  if(!n){ $app.replaceChildren(topbar,h("div",{class:"card empty"},h("p",{class:"lead"},"Não há itens para este código."))); return; }
  const it=S.mine[S.idx], lab=labelFor(it), cur=S.resp.get(it.i);
  const defs = h("details",{class:"def",open:ls.get("kids_def_open")==="1"?true:null},
    h("summary",{},"Ver descrição e exemplo"),
    h("div",{class:"defbody"},h("div",{},h("b",{},"Descrição"),h("div",{},lab.desc)),
      lab.ex?h("div",{},h("b",{},"Exemplo"),h("div",{},lab.ex)):null));
  defs.addEventListener("toggle",()=>ls.set("kids_def_open",defs.open?"1":"0"));
  const card = h("div",{class:"card",style:"display:flex;flex-direction:column;gap:18px"},
    h("div",{},h("div",{class:"sec"},`Mensagem · ${S.idx+1} de ${n}`),h("div",{class:"msg"},it.m)),
    h("div",{class:"rotulo"},h("div",{class:"sec",style:"margin:0"},"Rótulo"),
      h("div",{class:"term"},lab.name), defs));
  const answer = h("div",{},h("p",{class:"q"},"O rótulo acima descreve corretamente esta mensagem."),
    h("p",{class:"hint",style:"margin:-4px 0 10px"},"Indique o quanto você concorda com a afirmação. Atalho: teclas 1 a 5."),
    h("div",{class:"likert",role:"radiogroup","aria-label":"Concordância"},
      LIKERT.map(([v,t])=>h("button",{class:"lk lk"+v+(cur===v?" on":""),role:"radio","aria-checked":cur===v?"true":"false",onclick:()=>answer_(v)},h("b",{},String(v)),h("span",{},t)))));
  const st=h("span",{id:"st",class:"status"+(S.saveErr||S.pending.length?" err":"")},statusText());
  const nav=h("div",{class:"nav"},h("button",{class:"btn",disabled:S.idx===0?true:null,onclick:()=>go(S.idx-1)},"← Voltar"),st,
    h("button",{class:"btn",disabled:S.idx>=n-1?true:null,onclick:()=>go(S.idx+1)},"Pular →"));
  const fin=finished?h("div",{class:"card"},h("strong",{},"Você respondeu todos os itens. Obrigada!"),h("p",{class:"lead",style:"margin-top:4px"},"Pode revisar com Voltar; mudar uma resposta sobrescreve a anterior.")):null;
  $app.replaceChildren(...[topbar,fin,card,answer,nav].filter(Boolean)); window.scrollTo(0,0);
}

const LIKERT=[[1,"Discordo totalmente"],[2,"Discordo"],[3,"Nem concordo nem discordo"],[4,"Concordo"],[5,"Concordo totalmente"]];
function statusText(){
  const it=S.mine[S.idx], np=S.pending.length;
  return S.saveErr || (np?"enviando…":(it&&S.resp.has(it.i)?"resposta salva":""));
}
// Atualiza só o texto de status, sem redesenhar a tela (não interrompe quem está lendo as instruções).
function updateStatus(){
  const el=document.getElementById("st"); if(!el) return;
  el.textContent=statusText(); el.className="status"+(S.saveErr||S.pending.length?" err":"");
}

function go(i){ S.idx=Math.max(0,Math.min(S.mine.length-1,i)); renderItem(); }

function answer_(r){
  const it=S.mine[S.idx]; if(!it) return;
  S.resp.set(it.i,r); S.saveErr=null;
  S.pending = S.pending.filter(p=>!(p.c===S.code&&p.item===it.i));
  S.pending.push({c:S.code,item:it.i,resposta:r});
  ls.set("kids_pending",JSON.stringify(S.pending));
  const wasIdx=S.idx, next=S.idx<S.mine.length-1?S.idx+1:S.idx;
  renderItem(); flush();
  setTimeout(()=>{ if(S.idx===wasIdx&&S.ann&&S.view==="item"){ S.idx=next; renderItem(); } },220);
}

async function flush(){
  if(S.flushing||!S.pending.length) return; S.flushing=true;
  try{
    while(S.pending.length){
      const code=S.pending[0].c, batch=S.pending.filter(p=>p.c===code).slice(0,50);
      await rpc("salvar",{p_codigo:code,p_respostas:batch.map(p=>({item:p.item,resposta:p.resposta}))});
      S.pending = S.pending.filter(p=>!batch.includes(p));
      ls.set("kids_pending",JSON.stringify(S.pending));
    }
    S.saveErr=null;
  }catch(e){ S.saveErr="Sem conexão com o servidor. Suas respostas ficam neste navegador e serão reenviadas."; setTimeout(flush,8000); }
  S.flushing=false; updateStatus();
}

document.addEventListener("keydown",e=>{
  if(!S.ann||!S.mine.length||e.metaKey||e.ctrlKey||e.altKey||!document.querySelector(".likert")) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  const k=e.key.toLowerCase();
  if(/^[1-5]$/.test(k)) answer_(Number(k));
  else if(k==="arrowleft") go(S.idx-1); else if(k==="arrowright") go(S.idx+1);
});
window.addEventListener("online",flush);
init();
</script></body></html>
